[project]
name = "agenda-scraper"
version = "0.1.0"
description = "Concerts, club nights and festivals across the Netherlands, scraped and republished as static JSON/TSV"
authors = [{ name = "Jurre Jan" }]
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.0",
    "mcp>=1.20.0",
    "websocket-client>=1.9.0",
]

[project.scripts]
agenda-scraper = "agenda_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenda_scraper"]

[tool.mypy]
mypy_path = "src"

[tool.ruff]
extend-exclude = [".claude"]  # scaffold-shipped scripts, not ours to lint

[tool.ruff.lint]
# Every date here is a Dutch calendar date printed on a poster, not an instant:
# a tz-aware datetime would be the wrong type, not a safer one.
ignore = ["DTZ011"]

# A group, not an optional-dependencies extra: `uv sync` installs groups by
# default, so `just install` gives you the linter and the type checker that
# `just check` runs. As an extra they were never installed, and `uv run mypy`
# silently fell through to whatever mypy was on $PATH.
[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=1.17.0",
    "pytest>=9.0.0",
    "ruff>=0.16.0",
]
