<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uitagenda</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎫</text></svg>">
<style>
:root {
  --ink:#17151a; --ink-soft:#5d5766; --ink-faint:#8e8797;
  --bg:#faf8f6; --card:#fff; --line:#e6e1dc; --line-soft:#f0ecE7;
  --accent:#c3324b; --accent-soft:#fdeef1;
  --ok:#2f7d5c; --warn:#a8621a;
  --fest:#c3324b; --gig:#7b3e6b; --club:#3f6b8c; --other:#6e7b3a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink:#f2eef4; --ink-soft:#a9a1b3; --ink-faint:#7a7285;
    --bg:#141218; --card:#1c1922; --line:#2e2937; --line-soft:#241f2c;
    --accent:#ff5f7e; --accent-soft:#2b1620;
    --ok:#5cc99a; --warn:#e0a04a;
    --fest:#ff5f7e; --gig:#c978b4; --club:#6fa8cf; --other:#a8b863;
  }
}
:root[data-theme="dark"] {
  --ink:#f2eef4; --ink-soft:#a9a1b3; --ink-faint:#7a7285;
  --bg:#141218; --card:#1c1922; --line:#2e2937; --line-soft:#241f2c;
  --accent:#ff5f7e; --accent-soft:#2b1620;
  --ok:#5cc99a; --warn:#e0a04a;
  --fest:#ff5f7e; --gig:#c978b4; --club:#6fa8cf; --other:#a8b863;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap { max-width:920px; margin:0 auto; padding:0 18px 80px; }

header { padding:34px 0 18px; }
h1 {
  margin:0; font-size:30px; letter-spacing:-.02em; font-weight:650;
  text-wrap:balance;
}
.meta { margin-top:6px; color:var(--ink-faint); font-size:13px; font-variant-numeric:tabular-nums; }
.meta b { color:var(--ink-soft); font-weight:600; }

.banner {
  margin:14px 0 0; padding:10px 14px; border-radius:9px;
  background:var(--accent-soft); color:var(--accent);
  border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  font-size:13.5px;
}
.banner ul { margin:6px 0 0; padding-left:18px; }

.controls {
  position:sticky; top:0; z-index:5; padding:12px 0;
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line-soft);
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
}
input[type=search] {
  flex:1 1 220px; min-width:0; padding:9px 12px; font:inherit;
  color:var(--ink); background:var(--card);
  border:1px solid var(--line); border-radius:8px;
}
input[type=search]:focus-visible, .chip:focus-visible, select:focus-visible {
  outline:2px solid var(--accent); outline-offset:2px;
}
select {
  padding:9px 10px; font:inherit; color:var(--ink);
  background:var(--card); border:1px solid var(--line); border-radius:8px;
}
.btn {
  padding:9px 12px; font:inherit; font-size:13.5px; cursor:pointer;
  color:var(--ink-soft); background:var(--card);
  border:1px solid var(--line); border-radius:8px; white-space:nowrap;
}
.btn:hover { border-color:color-mix(in srgb, var(--ink) 25%, var(--line)); }
.btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.btn.primary { color:var(--card); background:var(--ink); border-color:var(--ink); }

dialog#sheet {
  width:min(720px, 92vw); padding:0; color:var(--ink); background:var(--card);
  border:1px solid var(--line); border-radius:12px;
}
dialog#sheet::backdrop { background:color-mix(in srgb, #000 55%, transparent); }
.sheet-head { display:flex; align-items:baseline; gap:10px; padding:16px 18px 8px; }
.sheet-head h2 { margin:0; font-size:16px; font-weight:650; }
.sheet-head p { margin:0; flex:1; color:var(--ink-faint); font-size:12.5px; }
dialog#sheet textarea {
  display:block; width:calc(100% - 36px); height:44vh; margin:0 18px; padding:12px;
  font:12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  color:var(--ink); background:var(--bg); resize:vertical;
  border:1px solid var(--line); border-radius:8px;
}
.sheet-foot { display:flex; gap:8px; justify-content:flex-end; padding:12px 18px 16px; }

.chips { display:flex; flex-wrap:wrap; gap:6px; width:100%; }
.chip {
  padding:5px 11px; font:inherit; font-size:13px; cursor:pointer;
  color:var(--ink-soft); background:var(--card);
  border:1px solid var(--line); border-radius:999px;
}
.chip[aria-pressed="true"] {
  color:var(--card); background:var(--ink); border-color:var(--ink);
}
.chip .n { opacity:.55; margin-left:5px; font-variant-numeric:tabular-nums; }

.day { margin-top:26px; }
.day h2 {
  margin:0 0 8px; font-size:12px; font-weight:650;
  letter-spacing:.09em; text-transform:uppercase; color:var(--ink-faint);
}
.day h2 .rel { color:var(--accent); }

ul.events { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
li.ev {
  display:grid; grid-template-columns:52px 1fr auto; gap:12px; align-items:baseline;
  padding:11px 14px; background:var(--card);
  border:1px solid var(--line); border-radius:10px;
}
li.ev:hover { border-color:color-mix(in srgb, var(--ink) 25%, var(--line)); }
.t { color:var(--ink-faint); font-size:13px; font-variant-numeric:tabular-nums; }
.name { min-width:0; }
.name a { color:inherit; text-decoration:none; font-weight:550; }
.name a:hover { text-decoration:underline; text-underline-offset:2px; }
.where { display:block; margin-top:2px; font-size:12.5px; color:var(--ink-soft); }
.tag {
  font-size:11px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--ink-faint); white-space:nowrap;
}
.badge {
  display:inline-block; margin-left:6px; padding:1px 7px; border-radius:999px;
  font-size:11px; letter-spacing:.03em; text-transform:none;
  color:var(--warn); background:color-mix(in srgb, var(--warn) 14%, transparent);
}
.empty { margin-top:40px; color:var(--ink-faint); text-align:center; }
footer { margin-top:44px; padding-top:16px; border-top:1px solid var(--line-soft);
         color:var(--ink-faint); font-size:12.5px; }
footer a { color:var(--ink-soft); }
@media (max-width:560px) {
  li.ev { grid-template-columns:46px 1fr; }
  .tag { grid-column:2; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Uitagenda</h1>
    <div class="meta" id="meta">laden…</div>
    <div id="banner"></div>
  </header>

  <div class="controls">
    <input type="search" id="q" placeholder="Zoek op naam, zaal of artiest…" autocomplete="off">
    <select id="city">
      <option value="">heel Nederland</option>
    </select>
    <select id="range">
      <option value="7">komende week</option>
      <option value="14">komende 2 weken</option>
      <option value="31" selected>komende maand</option>
      <option value="93">komend kwartaal</option>
      <option value="0">alles</option>
    </select>
    <button class="btn" id="llm-open">Kopieer voor LLM</button>
    <div class="chips" id="chips"></div>
  </div>

  <main id="list"></main>

  <dialog id="sheet">
    <div class="sheet-head">
      <h2>Voor een LLM</h2>
      <p id="sheet-note"></p>
    </div>
    <textarea id="sheet-text" readonly spellcheck="false"></textarea>
    <div class="sheet-foot">
      <button class="btn" id="sheet-close">Sluiten</button>
      <button class="btn primary" id="sheet-copy">Kopieer</button>
    </div>
  </dialog>

  <footer>
    Ruwe data: <a href="events.json">events.json</a> · <a href="events.tsv">events.tsv</a> ·
    per stad, bron of zaal via <a href="routes.json">routes.json</a>.
    Vier keer per dag ververst op ubuntu-server.
  </footer>
</div>

<script>
const LABEL = {
  "ra-nl":"Resident Advisor", "podiuminfo":"Podiuminfo", "festivalinfo":"Festivalinfo",
  "tivoli":"TivoliVredenburg", "paradiso":"Paradiso", "dehelling":"De Helling",
  "ekko":"EKKO", "rotown":"Rotown", "muziekgieterij":"Muziekgieterij",
  "musicon":"Musicon", "dbstudio":"dB's",
};
const DAYS = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
const MONTHS = ["januari","februari","maart","april","mei","juni",
                "juli","augustus","september","oktober","november","december"];

let DATA = null;
const off = new Set(JSON.parse(localStorage.getItem("agenda:off") || "[]"));

const todayISO = () => new Date().toLocaleDateString("sv-SE");   // sv-SE is ISO

function dayLabel(iso) {
  const d = new Date(iso + "T12:00:00");
  const diff = Math.round((d - new Date(todayISO() + "T12:00:00")) / 864e5);
  const rel = diff === 0 ? "vandaag" : diff === 1 ? "morgen" : diff === 2 ? "overmorgen" : "";
  const base = `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
  return rel ? `${base} <span class="rel">· ${rel}</span>` : base;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function visible() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const days = +document.getElementById("range").value;
  const from = todayISO();
  let to = "9999";
  if (days) {
    const d = new Date(); d.setDate(d.getDate() + days);
    to = d.toLocaleDateString("sv-SE");
  }
  const city = document.getElementById("city").value;
  return DATA.events.filter(e =>
    !off.has(e.source) && (e.end || e.date) >= from && e.date <= to &&
    (!city || e.city === city) &&
    (!q || (e.title + " " + e.venue + " " + e.city + " " + LABEL[e.source])
             .toLowerCase().includes(q)));
}

function render() {
  const rows = visible();
  const list = document.getElementById("list");
  if (!rows.length) {
    list.innerHTML = '<p class="empty">Niets gevonden. Ruimer datumbereik of andere zoekterm?</p>';
    return;
  }
  const byDay = new Map();
  for (const e of rows) (byDay.get(e.date) || byDay.set(e.date, []).get(e.date)).push(e);

  list.innerHTML = [...byDay].map(([date, evs]) => `
    <section class="day">
      <h2>${dayLabel(date)}</h2>
      <ul class="events">${evs.map(e => `
        <li class="ev">
          <span class="t">${esc(e.time || "—")}</span>
          <span class="name">
            <a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>
            ${e.status ? `<span class="badge">${esc(e.status)}</span>` : ""}
            <span class="where">${esc(e.venue || LABEL[e.source] || e.source)}${
            e.city ? " · " + esc(e.city) : ""}</span>
          </span>
          <span class="tag">${esc(LABEL[e.source] || e.source)}</span>
        </li>`).join("")}
      </ul>
    </section>`).join("");
}

function drawCities() {
  const counts = {};
  for (const e of DATA.events) if (e.city) counts[e.city] = (counts[e.city] || 0) + 1;
  const sel = document.getElementById("city");
  sel.innerHTML = `<option value="">heel Nederland</option>` +
    Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([c, n]) =>
      `<option value="${esc(c)}">${esc(c)} (${n})</option>`).join("");
}

function drawChips() {
  const counts = {};
  for (const e of DATA.events) counts[e.source] = (counts[e.source] || 0) + 1;
  document.getElementById("chips").innerHTML = Object.keys(counts).sort().map(s =>
    `<button class="chip" data-src="${esc(s)}" aria-pressed="${!off.has(s)}">
       ${esc(LABEL[s] || s)}<span class="n">${counts[s]}</span></button>`).join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const s = b.dataset.src;
    off.has(s) ? off.delete(s) : off.add(s);
    b.setAttribute("aria-pressed", String(!off.has(s)));
    try { localStorage.setItem("agenda:off", JSON.stringify([...off])); } catch (_) {}
    render();
  });
}

// ── the LLM hand-off ─────────────────────────────────────────────────────────
// Hands over instructions, not data: how the routes and the MCP server work, so
// the model can fetch what it needs itself and keep working after this tab is
// closed. The text is llm.txt verbatim — one source of truth, so the modal
// cannot drift from the documentation the feed ships.
function slug(name) {
  return name.normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
             .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

function sourceUrl() {
  const city = document.getElementById("city").value;
  const base = location.origin;
  if (!city) return `${base}/events.json`;
  return +document.getElementById("range").value <= 7
    ? `${base}/city/${slug(city)}/week.json`
    : `${base}/city/${slug(city)}.json`;
}

function intro() {
  return [
    "Hieronder staat de handleiding bij de uitagenda-feed: welke endpoints er zijn,",
    "wat de velden betekenen, en hoe je hem als MCP-server draait.",
    `Deze selectie in de agenda: ${sourceUrl()}`,
    "", "",
  ].join("\n");
}

function openSheet() {
  const area = document.getElementById("sheet-text");
  const note = document.getElementById("sheet-note");
  document.getElementById("sheet-copy").textContent = "Kopieer";
  area.value = "laden…";
  note.textContent = "endpoints en MCP";
  document.getElementById("sheet").showModal();
  fetch("llm.txt", { cache: "no-store" })
    .then((r) => (r.ok ? r.text() : Promise.reject(new Error(r.status))))
    .then((doc) => {
      area.value = intro() + doc;
      note.textContent = `endpoints en MCP · ${Math.round(area.value.length / 1024)} kB`;
    })
    .catch(() => {
      area.value = intro() +
        `Kon llm.txt niet laden — lees hem rechtstreeks: ${location.origin}/llm.txt`;
    });
}

function copySheet() {
  const area = document.getElementById("sheet-text");
  const btn = document.getElementById("sheet-copy");
  const done = () => { btn.textContent = "Gekopieerd ✓"; };
  // Clipboard access is refused outside a secure context and in some embedded
  // views; the selection fallback still works there.
  navigator.clipboard.writeText(area.value).then(done, () => {
    area.select();
    document.execCommand("copy");
    done();
  });
}

function drawMeta() {
  const gen = new Date(DATA.generated_at);
  const ageH = (Date.now() - gen) / 36e5;
  const when = gen.toLocaleString("nl-NL",
    { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
  document.getElementById("meta").innerHTML =
    `<b>${DATA.count}</b> events uit <b>${Object.keys(DATA.sources).length}</b> bronnen · ` +
    `ververst ${esc(when)}` + (ageH > 8 ? " — <b>verouderd</b>" : "");

  const problems = DATA.problems || [];
  const stale = ageH > 8 ? [`data is ${Math.round(ageH)} uur oud — draait de timer nog?`] : [];
  const all = [...problems, ...stale];
  document.getElementById("banner").innerHTML = all.length
    ? `<div class="banner"><strong>Let op</strong><ul>${
        all.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>`
    : "";
}

fetch("events.json", { cache: "no-store" })
  .then(r => r.json())
  .then(d => { DATA = d; drawMeta(); drawCities(); drawChips(); render(); })
  .catch(e => {
    document.getElementById("meta").textContent = "kon events.json niet laden";
    document.getElementById("list").innerHTML =
      `<p class="empty">${esc(e.message)}</p>`;
  });

document.getElementById("q").oninput = render;
document.getElementById("range").onchange = render;
document.getElementById("city").onchange = render;
document.getElementById("llm-open").onclick = openSheet;
document.getElementById("sheet-copy").onclick = copySheet;
document.getElementById("sheet-close").onclick = () => document.getElementById("sheet").close();
// Clicking the backdrop closes it; clicks inside the dialog land on a child.
document.getElementById("sheet").onclick = (e) => {
  if (e.target.id === "sheet") e.target.close();
};
</script>
</body>
</html>
